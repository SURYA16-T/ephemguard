[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemguard"
version = "0.1.0"
description = "Cross-platform security gateway for AI agent tool calls"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0", "bashlex>=0.18"]

[project.urls]
Homepage = "https://github.com/SURYA16-T/ephemguard"
Repository = "https://github.com/SURYA16-T/ephemguard.git"
Issues = "https://github.com/SURYA16-T/ephemguard/issues"

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-aiohttp>=1.0.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23.0",
    "pytest-aiohttp>=1.0.0",
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
]
dashboard = [
    "aiohttp>=3.9.0",
    "psutil>=5.9.0",
]

[project.scripts]
ephemguard = "ephemguard.cli:main"

[tool.setuptools.packages.find]
include = ["ephemguard*"]
