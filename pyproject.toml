[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ephemguard"
version = "0.1.0"
description = "Cross-platform security gateway for AI agent tool calls"
requires-python = ">=3.9"
dependencies = ["PyYAML>=6.0", "bashlex>=0.18"]

[project.optional-dependencies]
test = ["pytest>=8.0", "aiohttp", "psutil"]
dashboard = ["aiohttp>=3.9.0", "psutil>=5.9.0"]

[project.scripts]
ephemguard = "ephemguard.cli:main"

[tool.setuptools.packages.find]
include = ["ephemguard*"]
